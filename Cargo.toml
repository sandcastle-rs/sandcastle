[workspace]
members = [".", "crates/sandcastle-proto", "crates/sandcastle-guest", "crates/sandcastle-dockerfile"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"

[package]
name = "sandcastle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
libloading = "0.9.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sandcastle-proto = { path = "crates/sandcastle-proto" }
zstd = "0.14.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.34"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls"] }
oci-spec = { version = "0.10.0", default-features = false, features = ["image"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "fs", "io-util"] }

rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
tar = "0.4.46"
